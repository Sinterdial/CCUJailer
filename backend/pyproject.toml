[project]
name = "ccujailer"
version = "0.1.0"
description = "Star Citizen CCU monitor with bilingual i18n, dual DB migration, and programmable webhook notifications."
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "httpx[socks]>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "argon2-cffi>=23.1.0",
  "pyjwt[crypto]>=2.10.0",
  "pyotp>=2.9.0",
  "segno>=1.6.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["cj"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
